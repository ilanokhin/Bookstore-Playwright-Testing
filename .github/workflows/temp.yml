name: Временный workflow

on:
  workflow_dispatch:

jobs:
  chrome-tests:
    name: Временный workflow
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Проверка кэша
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: chrome.tar
          key: python-playwright-chrome-testing

      - name: Загрузка образа в Docker (если был в кэше)
        if: steps.cache-restore.outputs.cache-hit == 'true'
        run: docker load -i chrome.tar

      - name: Загрузка образа с Docker Hub (если не было в кэше)
        id: docker-pull
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          docker pull ilanokhin/python-playwright-chrome-testing:latest
          docker tag ilanokhin/python-playwright-chrome-testing:latest python-playwright-chrome-testing:latest
        continue-on-error: true

      - name: Сборка Docker образа (если загрузка не удалась)
        if: steps.docker-pull.outcome == 'failure'
        run: docker build -t python-playwright-chrome-testing:latest -f ./Dockerfile_for_chrome .

      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-playwright-chrome-testing:latest \
            /bin/sh -c "pytest --headless --video"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-playwright-chrome-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
