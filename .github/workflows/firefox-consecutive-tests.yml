name: Последовательные автотесты на Firefox

on:
  workflow_dispatch:

jobs:
  firefox-tests:
    name: Последовательные автотесты на Firefox
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Сборка Docker образа
        run: docker build -t python-playwright-firefox-testing:latest -f ./Dockerfile_for_firefox .
        continue-on-error: true

      - name: Загрузка образа с Docker Hub (если сборка не удалась)
        if: failure()
        run: |
          docker pull ilanokhin/python-playwright-firefox-testing:latest
          docker tag ilanokhin/python-playwright-firefox-testing:latest python-playwright-firefox-testing:latest

      - name: Запуск UI тестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-playwright-firefox-testing:latest \
            /bin/sh -c "pytest --headless --firefox"

      - name: Создание Allure отчета
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-playwright-firefox-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
