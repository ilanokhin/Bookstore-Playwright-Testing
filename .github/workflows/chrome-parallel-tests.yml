name: Параллельные автотесты на Chrome
on:
  workflow_dispatch:
  workflow_call:
env:
  REGISTRY: ilanokhin
  IMAGE: python-playwright-chrome-testing:latest

jobs:
  chrome-parallel-tests:
    name: Параллельные автотесты на Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      - name: Загрузка образа с Docker Hub
        run: |
          docker pull $REGISTRY/$IMAGE
          docker tag $REGISTRY/$IMAGE $IMAGE

      - name: Запуск автотестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project $IMAGE /bin/sh -c \
          "pytest --headless -n=auto || pytest --lf --headless --reruns=2 --reruns-delay=15 \
          --screenshot-every-time --video"

      - name: Создание Allure отчёта
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project $IMAGE /bin/sh -c \
          "allure generate allure-data -c --single-file; mv allure-report/index.html allure-report.html"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report.html
