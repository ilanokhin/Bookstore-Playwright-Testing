name: Параллельные автотесты на Safari

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  ui-tests:
    name: Параллельные автотесты на Safari
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода репозитория
        uses: actions/checkout@v6

      #- name: Сборка Docker образа
        #run: docker build -t python-playwright-safari-testing:latest .
        #continue-on-error: true

      - name: Загрузка образа с Docker Hub (если сборка не удалась)
        if: failure()
        run: |
          docker pull ilanokhin/python-playwright-safari-testing:latest
          docker tag ilanokhin/python-playwright-safari-testing:latest python-playwright-safari-testing:latest

      - name: Запуск UI тестов
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-playwright-safari-testing:latest \
            /bin/sh -c "pytest --headless --safari -n=auto"

      - name: Создание Allure отчета
        if: always()
        run: |
          docker run --rm -v ${{ github.workspace }}:/docker/project python-playwright-safari-testing:latest \
            /bin/sh -c "allure generate allure-data -c --single-file"

      - name: Выгрузка Allure отчёта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
